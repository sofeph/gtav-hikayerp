<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hikaye TV</title>
  <link rel="stylesheet" href="player.css">
  <script src="player.js" defer></script>
</head>
<body>
  <main>
    <section class="screen" aria-label="Televizyon yayını">
      <div id="youtube-player"></div>
      <div id="empty" class="empty">
        <span class="play-icon" aria-hidden="true">▶</span>
        <h1>Hikaye TV</h1>
        <p id="status">Kanal listesi yükleniyor...</p>
      </div>
      <div class="channel-banner">
        <span id="channel-number">--</span>
        <strong id="channel-name">Hikaye TV</strong>
        <small id="program-title">Yayın bekleniyor</small>
      </div>
    </section>
    <nav class="channel-controls" aria-label="Kanal seçimi">
      <button id="previous" type="button" aria-label="Önceki kanal">◀</button>
      <span>KANAL DEĞİŞTİR</span>
      <button id="next" type="button" aria-label="Sonraki kanal">▶</button>
    </nav>
    <label class="volume">Ses <input id="volume" type="range" min="0" max="100" step="5" value="70"></label>
    <p id="message" role="status"></p>
  </main>
</body>
</html>
